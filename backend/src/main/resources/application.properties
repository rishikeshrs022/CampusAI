# ========================================================
# CampusAI - Spring Boot Properties Configuration
# ========================================================

# Server Config
server.port=8080
server.servlet.context-path=/

# H2 Database DataSource configuration
spring.datasource.url=jdbc:h2:mem:campusai_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA & Hibernate DDL properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true

# Spring MVC static resources configuration
spring.web.resources.static-locations=classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging configurations
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
