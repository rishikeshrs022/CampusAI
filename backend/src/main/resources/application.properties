# ========================================================
# CampusAI - Spring Boot Properties Configuration
# ========================================================

# Server Config
server.port=8080
server.servlet.context-path=/

# MySQL Database DataSource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/campusai_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate DDL properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring MVC static resources configuration
spring.web.resources.static-locations=classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging configurations
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
